{% load static %}
{% load compress %}

{% compress css file %}
<link rel="stylesheet" type="text/css" href="{% static 'bargraph/style.css' %}">
{% endcompress %}

<div class="container-fluid">
  <div class="row d-flex flex-column justify-content-left align-items-start">
    <div class="round-description-container">
      <div id="round-description-wrapper" class="round-description-wrapper" role="status" aria-live="polite" aria-atomic="true">
        <div class="round-description-text">
          <span id="bargraph-interactive-round-description">
          </span>
          <span id="bargraph-interactive-why-button">
            <button type="button" class="btn btn-link faq-link" onclick="showFaqs()">Read a detailed explanation</button>.
          </span>
        </div>
      </div>
    </div>
    <div class="shadow-wrapper col-md-12 col-xl-10" id="bargraph-interactive-body">
      <div id="bargraph-slider-container" class="ml-auto mr-auto">
      </div>
    </div>
    <div id="faq-text"></div>
  </div>
</div>
